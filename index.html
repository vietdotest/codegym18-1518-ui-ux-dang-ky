<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tạo tài khoản — Mộc</title><link rel="stylesheet" href="style.css"><script src="form.js" defer></script></head>
<body><main class="card"><a class="brand" href="index.html" aria-label="Mộc — Trang đăng ký">mộc<span>.</span></a><p class="eyebrow">BẮT ĐẦU HÀNH TRÌNH</p><h1>Tạo tài khoản</h1><p class="intro">Một nơi để lưu những điều bạn yêu thích.</p><form action="success.html" method="get"><label for="fullname">Họ và tên</label><input id="fullname" autocomplete="name" required maxlength="100" placeholder="Nhập họ và tên"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="ban@example.com"><label for="password">Mật khẩu</label><input id="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="password-hint"><small id="password-hint">Sử dụng ít nhất 8 ký tự.</small><label for="confirmation">Xác nhận mật khẩu</label><input id="confirmation" type="password" autocomplete="new-password" minlength="8" required aria-describedby="confirmation-hint"><small id="confirmation-hint">Nhập lại mật khẩu vừa tạo.</small><button type="submit">Tạo tài khoản <span aria-hidden="true">→</span></button></form><p class="footnote">Thông tin rõ ràng. Thao tác đơn giản.</p></main></body>
</html>
